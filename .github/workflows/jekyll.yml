# Workflow for building and deploying an Academic Pages / Jekyll site to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'        
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Fetch private site data
        # 私有数据（培训经历 trainings.yml、赛事数据 races.json）放在私有仓库 ZhiyunXu20/site-data，
        # 用仓库 Secret SITE_DATA_TOKEN（只读的 fine-grained token）拉取，只在构建时使用，不会提交到本仓库。
        env:
          SITE_DATA_TOKEN: ${{ secrets.SITE_DATA_TOKEN }}
        run: |
          if [ -z "$SITE_DATA_TOKEN" ]; then
            echo "::warning::SITE_DATA_TOKEN is not set; private data pages will be empty."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${SITE_DATA_TOKEN}@github.com/ZhiyunXu20/site-data.git" /tmp/site-data
          for f in trainings.yml races.json; do
            if [ -f "/tmp/site-data/$f" ]; then cp "/tmp/site-data/$f" "_data/$f"; else echo "::warning::$f not found in site-data"; fi
          done
          rm -rf /tmp/site-data
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
